# cpaleasing.com — final Nginx config (HTTPS, canonical host = www).
# Location on VPS: /etc/nginx/sites-available/cpaleasing.com
# Site:            fully static, served from /app/cpa-aviation/site (no Node server / PM2).
#                  deploy/deploy.sh builds into .output/public and then swaps it into site/.

# 1) HTTP: serve ACME challenges (certificate renewal), redirect everything else to https://www
server {
    listen 80;
    listen [::]:80;
    server_name cpaleasing.com www.cpaleasing.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://www.cpaleasing.com$request_uri;
    }
}

# 2) HTTPS apex: redirect to www
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cpaleasing.com;

    ssl_certificate     /etc/letsencrypt/live/cpaleasing.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cpaleasing.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://www.cpaleasing.com$request_uri;
}

# 3) HTTPS www: the real site, static files
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.cpaleasing.com;

    ssl_certificate     /etc/letsencrypt/live/cpaleasing.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cpaleasing.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/cpaleasing.com.access.log;
    error_log  /var/log/nginx/cpaleasing.com.error.log;

    root  /app/cpa-aviation/site;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # Security headers (formerly sent by the Node server). Server level only:
    # an add_header inside a location would drop all of these for that location.
    # The contact form posts to the CPA leads API from the browser; no CSP is set on this site.
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # SEO redirects the Node server used to do: /index.html, /index, /home -> /, and no trailing slash.
    location = /index.html { return 301 /$is_args$args; }
    location = /index      { return 301 /$is_args$args; }
    location = /home       { return 301 /$is_args$args; }
    rewrite ^/(.+)/$ /$1 permanent;

    # Hashed build assets never change: cache for a long time.
    location /assets/ {
        expires 1y;
        access_log off;
    }

    # /about -> about/index.html (no redirect to /about/)
    location / {
        try_files $uri $uri/index.html =404;
    }

    # The app's own not-found page (it carries a noindex meta tag).
    error_page 404 /404.html;
}
