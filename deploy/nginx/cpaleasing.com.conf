# cpaleasing.com — final Nginx config (HTTPS, canonical host = www).
# Location on VPS: /etc/nginx/sites-available/cpaleasing.com
# App:             127.0.0.1:3003 (Nitro node server, PM2 name "cpa-aviation")

upstream cpa_aviation {
    server 127.0.0.1:3003;
    keepalive 16;
}

# 1) HTTP: serve ACME challenges (certificate renewal), redirect everything else to https://www
server {
    listen 80;
    listen [::]:80;
    server_name cpaleasing.com www.cpaleasing.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://www.cpaleasing.com$request_uri;
    }
}

# 2) HTTPS apex: redirect to www
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cpaleasing.com;

    ssl_certificate     /etc/letsencrypt/live/cpaleasing.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cpaleasing.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://www.cpaleasing.com$request_uri;
}

# 3) HTTPS www: the real site, proxied to the Node server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.cpaleasing.com;

    ssl_certificate     /etc/letsencrypt/live/cpaleasing.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cpaleasing.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/cpaleasing.com.access.log;
    error_log  /var/log/nginx/cpaleasing.com.error.log;

    # No uploads or backend forms (contact form opens a mailto: draft).
    client_max_body_size 1m;

    # HSTS is added here because the app itself does not send it.
    add_header Strict-Transport-Security "max-age=63072000" always;

    location / {
        proxy_pass http://cpa_aviation;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # The app redirects to https when X-Forwarded-Proto is "http" and builds
        # canonical/robots URLs from the forwarded host — both must be passed.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;

        proxy_read_timeout 60s;
    }
}
